<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从沙子到芯片 — 硅提纯与光刻工艺可视化</title>
<style>
  :root{
    --bg:#0b0e17; --panel:#131826; --panel2:#1a2135; --line:#2a3350;
    --txt:#e8ecf6; --dim:#8b96b3; --accent:#4da3ff; --accent2:#ffb347;
    --good:#4ade80; --hot:#ff6b4a; --violet:#a78bfa;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh}
  header{padding:26px 32px 18px;text-align:center;background:linear-gradient(180deg,#101627,var(--bg))}
  header h1{font-size:26px;letter-spacing:2px}
  header h1 .grad{background:linear-gradient(90deg,#4da3ff,#a78bfa,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--dim);margin-top:6px;font-size:13px}

  .tabs{display:flex;justify-content:center;gap:14px;margin:14px 0 0}
  .tab{padding:10px 26px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
       color:var(--dim);cursor:pointer;font-size:15px;transition:.25s}
  .tab.active{color:#fff;border-color:var(--accent);background:linear-gradient(135deg,#173257,#1a2135);box-shadow:0 0 18px rgba(77,163,255,.25)}
  .tab:hover{color:#fff}

  .layout{display:flex;max-width:1280px;margin:18px auto 40px;gap:16px;padding:0 16px}
  .steps{width:240px;flex-shrink:0}
  .steps .chapter-title{font-size:12px;color:var(--dim);letter-spacing:2px;margin:6px 0 10px 4px}
  .step-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;
    background:var(--panel);border:1px solid transparent;border-radius:10px;color:var(--dim);cursor:pointer;font-size:14px;transition:.2s;position:relative}
  .step-btn .num{width:24px;height:24px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--dim);flex-shrink:0;border:1px solid var(--line)}
  .step-btn.active{background:var(--panel2);border-color:var(--accent);color:#fff}
  .step-btn.active .num{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:bold}
  .step-btn:hover{color:#fff}
  .step-btn.done .num{border-color:var(--good);color:var(--good)}

  .main{flex:1;min-width:0}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .scene-wrap{position:relative;background:radial-gradient(ellipse at 50% 30%,#141c30 0%,#0d1120 70%)}
  .scene{display:none}
  .scene.active{display:block}
  .scene svg{display:block;width:100%;height:auto}

  .info{padding:20px 26px 24px;border-top:1px solid var(--line)}
  .info h2{font-size:20px;margin-bottom:4px;display:flex;align-items:center;gap:10px}
  .info h2 .badge{font-size:11px;padding:3px 10px;border-radius:999px;background:#173257;color:var(--accent);letter-spacing:1px;font-weight:normal}
  .info .desc{color:#c3cbe0;line-height:1.9;font-size:14.5px;margin-top:10px}
  .facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .fact{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px}
  .fact b{color:var(--accent2);font-weight:normal;display:block;font-size:11px;letter-spacing:1px;margin-bottom:2px}
  .fact span{color:#fff;font-size:14px}
  .eq{margin-top:14px;background:#0d1322;border:1px dashed #34406a;border-radius:10px;padding:10px 16px;
      font-family:Consolas,monospace;color:#9fd0ff;font-size:15px;display:inline-block}

  .controls{display:flex;align-items:center;gap:12px;padding:14px 26px;border-top:1px solid var(--line);background:var(--panel2)}
  .controls button{padding:9px 22px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
      color:var(--txt);cursor:pointer;font-size:14px;transition:.2s}
  .controls button:hover{border-color:var(--accent);color:var(--accent)}
  .controls button.primary{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:bold}
  .controls button.primary:hover{color:#04101f;filter:brightness(1.15)}
  .progress{flex:1;height:6px;background:#0d1322;border-radius:3px;overflow:hidden}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet));border-radius:3px;transition:width .4s}
  .counter{color:var(--dim);font-size:13px;min-width:52px;text-align:right}

  /* ============ 通用 SVG 动画 ============ */
  .flow{stroke-dasharray:6 8;animation:dashmove 1s linear infinite}
  .flow-slow{stroke-dasharray:5 9;animation:dashmove 2.2s linear infinite}
  @keyframes dashmove{to{stroke-dashoffset:-28}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .flicker{animation:flicker .18s steps(2) infinite}
  @keyframes flicker{0%{opacity:1}50%{opacity:.35}100%{opacity:.85}}
  .glow-hot{filter:drop-shadow(0 0 8px rgba(255,107,74,.8))}
  .glow-blue{filter:drop-shadow(0 0 6px rgba(77,163,255,.8))}
  .glow-uv{filter:drop-shadow(0 0 6px rgba(167,139,250,.9))}
  .spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}
  .spin-fast{animation:spin .7s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .float-up{animation:floatUp 2.4s linear infinite}
  @keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
  .shimmer{animation:shimmer 2.8s ease-in-out infinite}
  @keyframes shimmer{0%,100%{opacity:.15}50%{opacity:.95}}
  .rise{animation:rise 3.2s ease-in-out infinite}
  @keyframes rise{0%{transform:translateY(0)}50%{transform:translateY(-8px)}100%{transform:translateY(0)}}
  .lbl{font-size:12px;fill:#8b96b3}
  .lbl-b{font-size:13px;fill:#e8ecf6;font-weight:bold}
  .lbl-s{font-size:10px;fill:#68738f}

  /* 拉晶动画 */
  .cz-pull{animation:czpull 7s ease-in-out infinite}
  @keyframes czpull{0%{transform:translateY(66px)}80%{transform:translateY(0)}100%{transform:translateY(0)}}
  /* 线锯往复 */
  .wiresaw{animation:wiresaw .35s linear infinite alternate}
  @keyframes wiresaw{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
  /* 曝光步进 */
  .stepper{animation:stepper 6s steps(1) infinite}
  @keyframes stepper{0%{transform:translate(0,0)}16%{transform:translate(44px,0)}33%{transform:translate(88px,0)}
    50%{transform:translate(0,34px)}66%{transform:translate(44px,34px)}83%{transform:translate(88px,34px)}100%{transform:translate(0,0)}}
  .beam-blink{animation:beamblink 1s steps(1) infinite}
  @keyframes beamblink{0%{opacity:1}55%{opacity:1}60%{opacity:.15}100%{opacity:.15}}
  /* 显影溶解 */
  .dissolve{animation:dissolve 3s ease-in infinite}
  @keyframes dissolve{0%{opacity:1}55%{opacity:1}90%{opacity:0}100%{opacity:0}}
  /* 蚀刻下沉 */
  .etch-ion{animation:etchion 1.1s linear infinite}
  @keyframes etchion{0%{transform:translateY(-46px);opacity:0}20%{opacity:1}90%{opacity:1}100%{transform:translateY(0);opacity:0}}
  /* 注入离子 */
  .implant{animation:implant .9s linear infinite}
  @keyframes implant{0%{transform:translateY(-80px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(0);opacity:0}}
  /* 层生长 */
  .grow1{animation:grow 6s ease infinite;transform-box:fill-box;transform-origin:bottom}
  @keyframes grow{0%{transform:scaleY(0)}30%{transform:scaleY(1)}100%{transform:scaleY(1)}}
  /* 键合线绘制 */
  .draw{stroke-dasharray:140;stroke-dashoffset:140;animation:draw 3s ease infinite}
  @keyframes draw{30%{stroke-dashoffset:140}70%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}

  @media (max-width:900px){
    .layout{flex-direction:column}
    .steps{width:100%;display:flex;overflow-x:auto;gap:8px}
    .steps .chapter-title{display:none}
    .step-btn{width:auto;flex-shrink:0}
  }
</style>
</head>
<body>

<header>
  <h1>🏖️ 从沙子到芯片 <span class="grad">Silicon → Chip</span> 全流程可视化</h1>
  <p>石英砂如何被提纯成 99.9999999% 的单晶硅,又如何被光刻机加工成数十亿晶体管的芯片</p>
  <div class="tabs">
    <button class="tab active" data-ch="0">① 硅的提取与提纯</button>
    <button class="tab" data-ch="1">② 光刻与芯片制造</button>
  </div>
</header>

<div class="layout">
  <nav class="steps" id="stepNav"></nav>

  <div class="main">
    <div class="stage">
      <div class="scene-wrap" id="sceneWrap"><!-- 场景 SVG 由下方模板注入 --></div>
      <div class="info" id="infoPanel"></div>
      <div class="controls">
        <button id="btnPrev">← 上一步</button>
        <button id="btnPlay" class="primary">▶ 自动播放</button>
        <button id="btnNext">下一步 →</button>
        <div class="progress"><i id="progBar"></i></div>
        <div class="counter" id="counter"></div>
      </div>
    </div>
  </div>
</div>

<!-- 场景模板容器(隐藏),JS 按 id 取用 -->
<div id="sceneTemplates" style="display:none">

<!-- ============================================================
     第一章 场景 1:石英砂原料
============================================================ -->
<template id="sc-a1">
<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152038"/><stop offset="1" stop-color="#0d1120"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b878"/><stop offset="1" stop-color="#a8854e"/>
    </linearGradient>
    <linearGradient id="quartzG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/><stop offset=".5" stop-color="#b9d4f7"/><stop offset="1" stop-color="#7fa8dd"/>
    </linearGradient>
  </defs>
  <rect width="900" height="420" fill="url(#sky)"/>
  <circle cx="770" cy="70" r="34" fill="#ffd98a" opacity=".9"/>
  <circle cx="770" cy="70" r="48" fill="#ffd98a" opacity=".15" class="pulse"/>
  <!-- 沙丘 -->
  <path d="M0 300 Q 180 240 360 290 T 900 280 L 900 420 L 0 420 Z" fill="url(#sand)"/>
  <path d="M0 340 Q 250 300 480 335 T 900 330 L 900 420 L 0 420 Z" fill="#c2a05e"/>
  <!-- 闪烁的石英颗粒 -->
  <g fill="#fff">
    <circle cx="140" cy="315" r="2.5" class="shimmer"/>
    <circle cx="230" cy="345" r="2" class="shimmer" style="animation-delay:.4s"/>
    <circle cx="330" cy="320" r="2.5" class="shimmer" style="animation-delay:.9s"/>
    <circle cx="430" cy="360" r="2" class="shimmer" style="animation-delay:1.3s"/>
    <circle cx="520" cy="330" r="2.5" class="shimmer" style="animation-delay:.6s"/>
    <circle cx="620" cy="352" r="2" class="shimmer" style="animation-delay:1.7s"/>
    <circle cx="710" cy="325" r="2.5" class="shimmer" style="animation-delay:.2s"/>
    <circle cx="800" cy="350" r="2" class="shimmer" style="animation-delay:1s"/>
  </g>
  <!-- 放大镜 + SiO2 晶体结构 -->
  <g>
    <line x1="300" y1="330" x2="415" y2="235" stroke="#4da3ff" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="300" y1="330" x2="415" y2="425" stroke="#4da3ff" stroke-width="2" stroke-dasharray="4 4" opacity=".35"/>
    <circle cx="300" cy="330" r="10" fill="none" stroke="#4da3ff" stroke-width="2" class="glow-blue"/>
  </g>
  <g transform="translate(430,120)">
    <rect x="0" y="0" width="250" height="230" rx="16" fill="#101828" stroke="#2a3350"/>
    <text x="125" y="28" text-anchor="middle" class="lbl-b">二氧化硅晶体 SiO₂</text>
    <!-- 石英四面体结构示意 -->
    <g transform="translate(125,125)">
      <line x1="0" y1="0" x2="-52" y2="-38" stroke="#5b6a8f" stroke-width="3"/>
      <line x1="0" y1="0" x2="52" y2="-38" stroke="#5b6a8f" stroke-width="3"/>
      <line x1="0" y1="0" x2="-40" y2="48" stroke="#5b6a8f" stroke-width="3"/>
      <line x1="0" y1="0" x2="40" y2="48" stroke="#5b6a8f" stroke-width="3"/>
      <circle cx="0" cy="0" r="20" fill="#4da3ff" class="glow-blue"/>
      <text x="0" y="5" text-anchor="middle" font-size="13" fill="#04101f" font-weight="bold">Si</text>
      <g fill="#ff8a65">
        <circle cx="-52" cy="-38" r="13"/><circle cx="52" cy="-38" r="13"/>
        <circle cx="-40" cy="48" r="13"/><circle cx="40" cy="48" r="13"/>
      </g>
      <g fill="#04101f" font-size="10" font-weight="bold" text-anchor="middle">
        <text x="-52" y="-34">O</text><text x="52" y="-34">O</text>
        <text x="-40" y="52">O</text><text x="40" y="52">O</text>
      </g>
    </g>
    <text x="125" y="212" text-anchor="middle" class="lbl">1 个硅原子 + 4 个氧原子(四面体网络)</text>
  </g>
  <!-- 石英晶簇 -->
  <g transform="translate(120,250)">
    <polygon points="0,80 12,10 24,0 36,12 44,80" fill="url(#quartzG)" stroke="#dce9fb" stroke-width="1"/>
    <polygon points="40,80 55,30 66,22 76,34 82,80" fill="url(#quartzG)" stroke="#dce9fb" stroke-width="1" opacity=".9"/>
    <polygon points="-28,80 -18,36 -8,30 0,42 4,80" fill="url(#quartzG)" stroke="#dce9fb" stroke-width="1" opacity=".85"/>
    <text x="28" y="102" text-anchor="middle" class="lbl">高纯石英砂(硅含量 &gt; 99%)</text>
  </g>
  <text x="30" y="40" class="lbl-b" font-size="15">STEP 1 · 原料:石英砂</text>
  <text x="30" y="62" class="lbl">地壳中 27.7% 是硅 —— 仅次于氧,取之不尽</text>
</svg>
</template>

<!-- ============================================================
     第一章 场景 2:电弧炉碳热还原
============================================================ -->
<template id="sc-a2">
<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="furnaceBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4258"/><stop offset="1" stop-color="#232a3d"/>
    </linearGradient>
    <radialGradient id="melt" cx=".5" cy=".4" r=".8">
      <stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ff9d3f"/><stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="arcG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <text x="30" y="40" class="lbl-b" font-size="15">STEP 2 · 电弧炉冶炼 → 冶金级硅(纯度 ~98%)</text>
  <text x="30" y="62" class="lbl">石英砂 + 焦炭 / 木炭,2000°C 电弧下发生碳热还原反应</text>

  <!-- 进料 -->
  <g transform="translate(120,90)">
    <rect x="0" y="0" width="90" height="56" rx="8" fill="#1a2135" stroke="#2a3350"/>
    <text x="45" y="24" text-anchor="middle" class="lbl-b" font-size="12">石英砂 SiO₂</text>
    <text x="45" y="42" text-anchor="middle" class="lbl-s">+ 焦炭 C</text>
    <path d="M 100 28 H 165" stroke="#4da3ff" stroke-width="2.5" class="flow" fill="none" marker-end="url(#arrB)"/>
  </g>
  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4da3ff"/></marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ffb347"/></marker>
  </defs>

  <!-- 炉体 -->
  <g transform="translate(300,70)">
    <path d="M0 60 L 30 300 L 270 300 L 300 60 Z" fill="url(#furnaceBody)" stroke="#4b5570" stroke-width="2"/>
    <!-- 三根电极 -->
    <g>
      <rect x="60" y="-20" width="26" height="150" rx="4" fill="#111722" stroke="#39445f"/>
      <rect x="137" y="-20" width="26" height="160" rx="4" fill="#111722" stroke="#39445f"/>
      <rect x="214" y="-20" width="26" height="150" rx="4" fill="#111722" stroke="#39445f"/>
      <text x="150" y="-30" text-anchor="middle" class="lbl">石墨电极(通入强电流)</text>
    </g>
    <!-- 电弧 -->
    <g class="flicker glow-hot">
      <path d="M73 130 q 8 22 -4 44 q 14 -8 10 30" stroke="url(#arcG)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M150 140 q -10 20 6 40 q -14 -4 -8 26" stroke="url(#arcG)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M227 130 q 6 24 -8 42 q 16 -6 8 32" stroke="url(#arcG)" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 熔池 -->
    <path d="M22 225 L 30 300 L 270 300 L 278 225 Q 150 250 22 225 Z" fill="url(#melt)" class="glow-hot"/>
    <!-- CO 气泡 -->
    <g fill="#ffd9a8" opacity=".9">
      <circle cx="90" cy="290" r="5" class="float-up"/>
      <circle cx="150" cy="295" r="4" class="float-up" style="animation-delay:.7s"/>
      <circle cx="210" cy="292" r="5" class="float-up" style="animation-delay:1.4s"/>
      <circle cx="120" cy="296" r="3.5" class="float-up" style="animation-delay:2s"/>
    </g>
    <text x="150" y="272" text-anchor="middle" font-size="12" fill="#4a1d05" font-weight="bold">熔融硅 ~2000°C</text>
    <text x="150" y="330" text-anchor="middle" class="lbl">↑ CO 气体逸出</text>
  </g>

  <!-- 出料 -->
  <g transform="translate(640,240)">
    <path d="M -30 40 H 30" stroke="#ffb347" stroke-width="2.5" class="flow" fill="none" marker-end="url(#arrO)"/>
    <g transform="translate(45,0)">
      <rect x="0" y="10" width="150" height="70" rx="10" fill="#1a2135" stroke="#2a3350"/>
      <!-- 硅锭 -->
      <g transform="translate(18,30)">
        <polygon points="0,30 8,6 30,0 52,8 58,30" fill="#7e8aa8" stroke="#aab6d4"/>
        <polygon points="60,30 70,10 92,4 110,14 114,30" fill="#6b7794" stroke="#98a4c2"/>
      </g>
      <text x="75" y="72" text-anchor="middle" class="lbl-b" font-size="12">冶金级硅 MG-Si</text>
    </g>
    <text x="120" y="110" text-anchor="middle" class="lbl">纯度 ≈ 98%~99%</text>
    <text x="120" y="128" text-anchor="middle" class="lbl-s">还不够!芯片需要 99.9999999%</text>
  </g>
  <!-- 反应式 -->
  <g transform="translate(70,360)">
    <rect x="0" y="0" width="420" height="40" rx="8" fill="#0d1322" stroke="#34406a" stroke-dasharray="5 4"/>
    <text x="210" y="26" text-anchor="middle" font-size="16" fill="#9fd0ff" font-family="Consolas,monospace">SiO₂ + 2C  →(2000°C)→  Si + 2CO↑</text>
  </g>
</svg>
</template>

<!-- ============================================================
     第一章 场景 3:西门子法提纯
============================================================ -->
<template id="sc-a3">
<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="colG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31405e"/><stop offset="1" stop-color="#1d2740"/>
    </linearGradient>
    <linearGradient id="rodHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a4a"/><stop offset=".5" stop-color="#ffd08a"/><stop offset="1" stop-color="#ff8a4a"/>
    </linearGradient>
  </defs>
  <text x="30" y="40" class="lbl-b" font-size="15">STEP 3 · 西门子法提纯 → 电子级多晶硅(9 个 9)</text>
  <text x="30" y="62" class="lbl">先变成液体气体反复蒸馏除杂,再高温还原沉积回固体硅</text>
  <defs><marker id="arrB2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4da3ff"/></marker></defs>

  <!-- ① 氯化反应 -->
  <g transform="translate(60,110)">
    <rect x="0" y="0" width="130" height="170" rx="12" fill="#1a2135" stroke="#2a3350"/>
    <text x="65" y="26" text-anchor="middle" class="lbl-b" font-size="12">① 流化床反应器</text>
    <rect x="20" y="40" width="90" height="100" rx="8" fill="#141b2d" stroke="#39445f"/>
