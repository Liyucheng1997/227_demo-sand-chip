<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从沙子到芯片 · 3D 工艺全流程</title>
<style>
  :root{
    --bg:#07090f; --panel:#10141f; --panel2:#161c2b; --line:#232b40;
    --txt:#e8ecf6; --dim:#8b96b3; --accent:#5aa9ff; --accent2:#ffb347;
    --good:#4ade80; --violet:#a78bfa;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg)}
  body{color:var(--txt);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;min-height:100vh}
  header{display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#0e1322,#07090f);flex-wrap:wrap}
  header h1{font-size:19px;letter-spacing:1px;font-weight:600;white-space:nowrap}
  header h1 .grad{background:linear-gradient(90deg,#5aa9ff,#a78bfa,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--dim);font-size:12.5px;flex:1;min-width:200px}
  .tabs{display:flex;gap:8px}
  .tab{padding:8px 18px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
       color:var(--dim);cursor:pointer;font-size:14px;transition:.2s;font-family:inherit}
  .tab.active{color:#fff;border-color:var(--accent);background:linear-gradient(135deg,#173257,#161c2b);box-shadow:0 0 16px rgba(90,169,255,.22)}
  .tab:hover{color:#fff}

  .layout{display:flex;gap:16px;padding:16px;max-width:1680px;margin:0 auto}
  .steps{width:228px;flex-shrink:0}
  .steps .chapter-title{font-size:12px;color:var(--dim);letter-spacing:2px;margin:4px 0 10px 4px}
  .step-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;margin-bottom:6px;font-family:inherit;
    background:var(--panel);border:1px solid transparent;border-radius:10px;color:var(--dim);cursor:pointer;font-size:14px;transition:.2s}
  .step-btn .num{width:24px;height:24px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--dim);flex-shrink:0;border:1px solid var(--line)}
  .step-btn.active{background:var(--panel2);border-color:var(--accent);color:#fff}
  .step-btn.active .num{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:bold}
  .step-btn:hover{color:#fff}
  .step-btn.done .num{border-color:var(--good);color:var(--good)}

  .main{flex:1;min-width:0}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .viewport{position:relative;height:min(66vh,680px);min-height:380px;background:#05070c;cursor:grab;overflow:hidden}
  .viewport:active{cursor:grabbing}
  .viewport canvas{display:block}
  .label-layer{position:absolute;inset:0;pointer-events:none}

  /* 3D 标注 */
  .lbl3d{display:flex;align-items:center;gap:6px;pointer-events:none;transform-origin:left center}
  .lbl3d .dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(90,169,255,.55),0 0 8px rgba(90,169,255,.8);flex-shrink:0}
  .lbl3d .txt{font-size:12px;color:#eaf1ff;background:rgba(8,12,22,.72);border:1px solid rgba(120,150,210,.35);
    padding:3px 8px;border-radius:6px;white-space:nowrap;backdrop-filter:blur(4px);line-height:1.35}
  .lbl3d .txt small{display:block;color:#9fb0d4;font-size:10.5px}
  .lbl3d.hot .dot{box-shadow:0 0 0 2px rgba(255,140,60,.6),0 0 8px rgba(255,140,60,.9)}
  .lbl3d.hot .txt{border-color:rgba(255,150,80,.45)}
  .lbl3d.uv .dot{box-shadow:0 0 0 2px rgba(170,130,255,.6),0 0 8px rgba(170,130,255,.9)}
  .lbl3d.uv .txt{border-color:rgba(170,130,255,.5)}
  .lbl3d.big .txt{font-size:14px;font-weight:600}

  .ov{position:absolute;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
  .ov-title{top:14px;left:16px;flex-direction:column;gap:2px;pointer-events:none;max-width:60%}
  .ov-title .k{font-size:11px;color:var(--accent);letter-spacing:2px}
  .ov-title .t{font-size:20px;font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .ov-views{top:14px;right:14px;justify-content:flex-end;max-width:50%}
  .ov-tools{bottom:14px;right:14px}
  .ov-hint{bottom:16px;left:16px;font-size:11.5px;color:rgba(200,210,235,.6);pointer-events:none}
  .chip{padding:6px 12px;border-radius:8px;border:1px solid rgba(120,150,210,.35);background:rgba(10,14,24,.7);color:#cfd8ee;
        cursor:pointer;font-size:12.5px;font-family:inherit;backdrop-filter:blur(6px);transition:.2s}
  .chip:hover{border-color:var(--accent);color:#fff}
  .chip.on{background:rgba(90,169,255,.22);border-color:var(--accent);color:#fff}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;z-index:2}

  .info{padding:18px 24px 20px;border-top:1px solid var(--line)}
  .info h2{font-size:19px;margin-bottom:4px;display:flex;align-items:center;gap:10px}
  .info h2 .badge{font-size:11px;padding:3px 10px;border-radius:999px;background:#173257;color:var(--accent);letter-spacing:1px;font-weight:normal}
  .info .desc{color:#c3cbe0;line-height:1.9;font-size:14.5px;margin-top:8px}
  .info .desc b{color:#fff}
  .facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .fact{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px}
  .fact b{color:var(--accent2);font-weight:normal;display:block;font-size:11px;letter-spacing:1px;margin-bottom:2px}
  .fact span{color:#fff;font-size:14px}
  .eq{margin-top:14px;background:#0b1020;border:1px dashed #34406a;border-radius:10px;padding:10px 16px;
      font-family:Consolas,monospace;color:#9fd0ff;font-size:15px;display:inline-block}

  .controls{display:flex;align-items:center;gap:12px;padding:12px 24px;border-top:1px solid var(--line);background:var(--panel2)}
  .controls button{padding:8px 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-family:inherit;
      color:var(--txt);cursor:pointer;font-size:14px;transition:.2s}
  .controls button:hover{border-color:var(--accent);color:var(--accent)}
  .controls button.primary{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:bold}
  .controls button.primary:hover{color:#04101f;filter:brightness(1.12)}
  .progress{flex:1;height:6px;background:#0b1020;border-radius:3px;overflow:hidden}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet));border-radius:3px;transition:width .4s}
  .counter{color:var(--dim);font-size:13px;min-width:52px;text-align:right}

  .viewport:fullscreen{height:100vh}
  /* ?shot 截图模式:只显示 3D 视口 */
  body.shot header,body.shot .steps,body.shot .info,body.shot .controls{display:none}
  body.shot .layout{padding:0;max-width:none}
  body.shot .stage{border:0;border-radius:0}
  body.shot .viewport{height:100vh}

  @media (max-width:900px){
    header{padding:12px 16px;gap:10px}
    header h1{white-space:normal;font-size:17px}
    .lbl3d .txt{font-size:10.5px;padding:2px 6px}
    .lbl3d .txt small{font-size:9.5px}
    .layout{flex-direction:column;padding:10px}
    .steps{width:100%;display:flex;overflow-x:auto;gap:8px}
    .steps .chapter-title{display:none}
    .step-btn{width:auto;flex-shrink:0;margin:0}
    .viewport{height:58vh}
    .ov-views{max-width:100%;top:auto;bottom:56px;right:10px;left:10px;justify-content:flex-start}
    .ov-hint{display:none}
    .controls{flex-wrap:wrap}
  }
</style>
</head>
<body>

<header>
  <h1>从沙子到芯片 <span class="grad">Sand → Silicon → Chip</span></h1>
  <p>15 个工艺步骤 · 设备与微观结构 3D 建模 · 拖拽旋转 / 滚轮缩放 / 切换视角</p>
  <div class="tabs">
    <button class="tab active">① 硅的提取与提纯</button>
    <button class="tab">② 光刻与芯片制造</button>
  </div>
</header>

<div class="layout">
  <nav class="steps" id="stepNav"></nav>
  <div class="main">
    <div class="stage">
      <div class="viewport" id="viewport">
        <div class="loading" id="loading">正在加载 3D 场景…</div>
        <div class="ov ov-title"><span class="k" id="ovKicker"></span><span class="t" id="ovTitle"></span></div>
        <div class="ov ov-views" id="ovViews"></div>
        <div class="ov ov-tools">
          <button class="chip on" id="tglLabels" title="显示/隐藏标注">🏷 标注</button>
          <button class="chip" id="tglRotate" title="自动环绕">⟳ 环绕</button>
          <button class="chip" id="tglFull" title="全屏">⛶ 全屏</button>
        </div>
        <div class="ov ov-hint">左键拖拽旋转 · 右键平移 · 滚轮缩放</div>
      </div>
      <div class="info" id="infoPanel"></div>
      <div class="controls">
        <button id="btnPrev">← 上一步</button>
        <button id="btnPlay" class="primary">▶ 自动播放</button>
        <button id="btnNext">下一步 →</button>
        <div class="progress"><i id="progBar"></i></div>
        <div class="counter" id="counter"></div>
      </div>
    </div>
  </div>
</div>

<script src="dist/app.js"></script>
</body>
</html>
